# ====================================================================
# film_comment_system 内网/本地测试部署 Nginx 配置（纯 HTTP，无证书）
#
# 使用前提：
#   1. 前端构建产物放在 /opt/film/dist
#   2. 后端监听 127.0.0.1:8080（prod profile）
#   3. install.sh 在 DEPLOY_MODE=test 时自动选用本模板，并把
#      your-domain.com 替换为你填的内网 IP / 主机名
#
# 注意：本模式仅用于内网演练 / 功能验证，勿直接用于公网：
#   - 无 TLS，明文传输
#   - 后端环境文件会追加 SA_TOKEN_COOKIE_SECURE=false，
#     否则 HTTP 下浏览器不保存 Cookie，登录会立刻失效
# ====================================================================

server {
    listen 80;
    server_name your-domain.com;         # ★ install.sh 会替换为内网 IP 或主机名

    # 与后端 multipart 上限（100MB）保持一致，否则大文件上传会 413
    client_max_body_size 100m;

    # 静态资源基础安全头（接口的安全头由后端 SecurityHeadersFilter 统一输出）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 前端 SPA：history 路由必须回退到 index.html，否则刷新子路由 404
    root  /opt/film/dist;
    index index.html;

    # 页面路由：/login、/register、/logout、/updatePassword 的前端页面走 SPA，
    # 但 POST/PUT 请求要转给后端（前端页面本身是 GET）
    location = /login {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    location = /register {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    location = /logout {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    location = /updatePassword {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    # /currentUser 没有对应前端页面，直接反代
    location = /currentUser { include /etc/nginx/conf.d/api_proxy.inc; }

    # 业务接口前缀：全部反代到后端
    location /user/     { include /etc/nginx/conf.d/api_proxy.inc; }
    location /admin/    { include /etc/nginx/conf.d/api_proxy.inc; }
    location /film/     { include /etc/nginx/conf.d/api_proxy.inc; }
    location /comment/  { include /etc/nginx/conf.d/api_proxy.inc; }
    location /notice/   { include /etc/nginx/conf.d/api_proxy.inc; }
    location /category/ { include /etc/nginx/conf.d/api_proxy.inc; }
    # 上传/下载的图片也由后端提供（下载免登录，公开资源）
    location /files/    { include /etc/nginx/conf.d/api_proxy.inc; }

    # 其余全部走前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}