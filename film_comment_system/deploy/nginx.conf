# ====================================================================
# film_comment_system 前端静态托管 + 后端反向代理（Nginx 配置）
#
# 使用前提：
#   1. 前端构建产物放在 /opt/film/dist（npm run build 后拷贝）
#   2. 后端监听 127.0.0.1:8080（prod profile）
#   3. 证书文件路径按实际环境修改
#   4. 本配置为「同域名反代」模式（推荐）：
#      前后端同源 → 免 CORS、SameSite=Lax 天然满足、Cookie(secure) 正常
#
# 部署步骤：
#   1. 把 api_proxy.inc 与本文件放到 /etc/nginx/conf.d/
#      （片段文件必须用 .inc 后缀，叫 .conf 会被 conf.d/*.conf 自动加载，
#        导致 proxy_pass 在 http 上下文非法、nginx -t 失败）
#   2. 修改 server_name 与证书路径
#   3. nginx -t 校验后 reload
# ====================================================================

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;          # ★ 改成你的真实域名

    ssl_certificate     /etc/nginx/cert/fullchain.pem;   # ★ 证书路径
    ssl_certificate_key /etc/nginx/cert/privkey.pem;     # ★ 私钥路径
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 与后端 multipart 上限（100MB）保持一致，否则大文件上传会 413
    client_max_body_size 100m;

    # 静态资源安全头（接口的安全头由后端 SecurityHeadersFilter 统一输出）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # 前端 SPA：history 路由必须回退到 index.html，否则刷新子路由 404
    root  /opt/film/dist;
    index index.html;

    # 页面路由：/login、/register、/logout、/updatePassword 的前端页面走 SPA，
    # 但 POST/PUT 请求要转给后端（前端页面本身是 GET）
    location = /login {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    location = /register {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    location = /logout {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    location = /updatePassword {
        limit_except GET {
            # limit_except 内不允许 include（Nginx 1.14 语法限制），反代参数必须内联
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        try_files $uri /index.html;
    }
    # /currentUser 没有对应前端页面，直接反代
    location = /currentUser { include /etc/nginx/conf.d/api_proxy.inc; }

    # 业务接口前缀：全部反代到后端
    location /user/     { include /etc/nginx/conf.d/api_proxy.inc; }
    location /admin/    { include /etc/nginx/conf.d/api_proxy.inc; }
    location /film/     { include /etc/nginx/conf.d/api_proxy.inc; }
    location /comment/  { include /etc/nginx/conf.d/api_proxy.inc; }
    location /notice/   { include /etc/nginx/conf.d/api_proxy.inc; }
    location /category/ { include /etc/nginx/conf.d/api_proxy.inc; }
    # 上传/下载的图片也由后端提供（下载免登录，公开资源）
    location /files/    { include /etc/nginx/conf.d/api_proxy.inc; }

    # 其余全部走前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选：前端 SPA 的 CSP（注意：评论用 v-html 渲染净化后的 HTML，
    # 且页面存在内联样式，必须放开 style-src 'unsafe-inline'；
    # 建议先在测试环境验证页面/图片/编辑器全部正常再启用）
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self'; frame-ancestors 'none'" always;
}