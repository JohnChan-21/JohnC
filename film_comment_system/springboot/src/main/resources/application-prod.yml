server:
  port: 8080

spring:
  # 数据库配置：账号、密码、连接串全部由运行环境注入，仓库内不留任何凭据
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产务必使用最小权限的非 root 账号，通过环境变量 DB_USERNAME 注入
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 连接串通过环境变量 DB_URL 注入，推荐形态（启用 SSL、关闭 allowPublicKeyRetrieval、不含 allowMultiQueries）：
    # jdbc:mysql://<host>:3306/film_comment_system?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=GMT%2b8
    url: ${DB_URL}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # Redis 配置：连接信息由环境变量注入，生产必须启用密码
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 Cookie 名称）
  token-name: satoken
  # token 有效期（秒），默认 1 天
  timeout: 86400
  # token 最低活跃频率（秒），默认 1 小时
  active-timeout: 3600
  # 开启自动续期，每次请求刷新活跃时间
  auto-renew-active-timeout: true
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: true
  # token 风格（uuid）
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否尝试从 cookie 中读取 token
  is-read-cookie: true
  cookie:
    # 跨站请求不带 Cookie → 挡 CSRF
    same-site: Lax
    # JS 读不到 token（XSS 防护）；前端从响应体取 token，不受影响
    http-only: true
    path: /
    # 仅生产(https)开启；dev http 下别开 
    secure: true

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 文件上传的前缀url：部署时用环境变量 FILE_BASE_URL 注入真实域名；
# 若采用「Nginx 同域名反代」（前后端同源，推荐），可置为空字符串，返回相对路径 URL
fileBaseUrl: "${FILE_BASE_URL:https://your-domain.com}"

# CORS 允许的前端源（逗号分隔，支持通配模式如 https://*.example.com）：
# - 同域名反代（前后端同源，推荐）：保持为空即可，同源请求不走 CORS；
# - 前后端分域名部署：用环境变量 CORS_ALLOWED_ORIGINS 注入真实前端域名
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:}"